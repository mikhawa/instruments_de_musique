
services:
  php:
    build:
      context: .
      target: dev
    environment:
      DATABASE_URL: "mysql://${MARIADB_USER:-app}:${MARIADB_PASSWORD:-!ChangeMe!}@database:3306/${MARIADB_DATABASE:-app}?serverVersion=11.4.0-MariaDB&charset=utf8mb4"
      MAILER_DSN: "smtp://mailer:1025"
      # Dev uniquement : crée la table messenger_messages automatiquement (en prod : migration Doctrine)
      MESSENGER_TRANSPORT_DSN: "doctrine://default?auto_setup=1"
    volumes:
      - .:/var/www/html
    depends_on:
      database:
        condition: service_healthy

  worker:
    build:
      context: .
      target: dev
    command: ["php", "bin/console", "messenger:consume", "async", "-vv", "--time-limit=3600", "--memory-limit=128M"]
    restart: unless-stopped
    environment:
      DATABASE_URL: "mysql://${MARIADB_USER:-app}:${MARIADB_PASSWORD:-!ChangeMe!}@database:3306/${MARIADB_DATABASE:-app}?serverVersion=11.4.0-MariaDB&charset=utf8mb4"
      MAILER_DSN: "smtp://mailer:1025"
      # Dev uniquement : crée la table messenger_messages automatiquement (en prod : migration Doctrine)
      MESSENGER_TRANSPORT_DSN: "doctrine://default?auto_setup=1"
    volumes:
      - .:/var/www/html
    depends_on:
      database:
        condition: service_healthy

  web:
    image: nginx:1.27-alpine
    ports:
      - "8080:80"
    volumes:
      - .:/var/www/html:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - php

###> doctrine/doctrine-bundle ###
  database:
    image: mariadb:${MARIADB_VERSION:-11.4}
    environment:
      MARIADB_DATABASE: ${MARIADB_DATABASE:-app}
      # You should definitely change the password in production
      MARIADB_PASSWORD: ${MARIADB_PASSWORD:-!ChangeMe!}
      MARIADB_ROOT_PASSWORD: ${MARIADB_ROOT_PASSWORD:-!ChangeMe!}
      MARIADB_USER: ${MARIADB_USER:-app}
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      timeout: 5s
      retries: 5
      start_period: 60s
    volumes:
      - database_data:/var/lib/mysql:rw
      # You may use a bind-mounted host directory instead, so that it is harder to accidentally remove the volume and lose all your data!
      # - ./docker/db/data:/var/lib/mysql:rw
###< doctrine/doctrine-bundle ###

volumes:
###> doctrine/doctrine-bundle ###
  database_data:
###< doctrine/doctrine-bundle ###
